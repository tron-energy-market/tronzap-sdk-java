name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Windows runners default to PowerShell, which splits -Dkey=value arguments.
defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Verify (${{ matrix.os }}, Java ${{ matrix.java }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        java: ['17', '21', '25']
        exclude:
          # The version floor and the newest release only need one platform. macOS and
          # Windows are here for the platform-specific network error classification.
          - {os: macos-latest, java: '17'}
          - {os: windows-latest, java: '17'}
          - {os: macos-latest, java: '25'}
          - {os: windows-latest, java: '25'}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: mvn verify
        run: ./mvnw -B -ntp verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: surefire-${{ matrix.os }}-java${{ matrix.java }}
          path: target/surefire-reports/
