version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci

  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    groups:
      # Jackson ships to every consumer, so it comes as a PR of its own.
      build:
        patterns: ['*']
        exclude-patterns: ['com.fasterxml.jackson*']
    ignore:
      # Maven 3.10 leaves maven-metadata-local.xml in the Central bundle, which Central rejects:
      # https://github.com/mavenplugins/central-publishing-maven-plugin/issues/79
      - dependency-name: org.apache.maven:apache-maven
        versions: ['>= 3.10.0']
    commit-message:
      prefix: chore
