version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci

  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    groups:
      # Jackson ships to every consumer, so it comes as a PR of its own.
      build:
        patterns: ['*']
        exclude-patterns: ['com.fasterxml.jackson*']
    commit-message:
      prefix: chore
